name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a release commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release contract
        run: pnpm release:check "$GITHUB_REF_NAME"

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Verify package installation
        run: pnpm package:check

      - name: Pack release artifacts
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @andreabaldin/soe-core pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @andreabaldin/soe-svelte pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Publish core
        run: npm publish "./artifacts/andreabaldin-soe-core-${GITHUB_REF_NAME#v}.tgz"

      - name: Publish Svelte
        run: npm publish "./artifacts/andreabaldin-soe-svelte-${GITHUB_REF_NAME#v}.tgz"
